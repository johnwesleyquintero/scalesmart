<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(200, 20%, 95%)" /> <!-- Light cool gray -->
      <stop offset="100%" stop-color="hsl(200, 20%, 88%)" />
    </linearGradient>
    <style>
      <![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');
        .board-title-main {
          font-family: 'Open Sans', sans-serif;
          font-weight: 700;
          font-size: 56px;
          fill: hsl(210, 30%, 35%);
          text-anchor: middle;
        }
        .board-title-sub {
          font-family: 'Open Sans', sans-serif;
          font-weight: 400;
          font-size: 28px;
          fill: hsl(210, 25%, 45%);
          text-anchor: middle;
        }
        .column-title {
          font-family: 'Open Sans', sans-serif;
          font-weight: 600;
          font-size: 20px;
          fill: hsl(0, 0%, 25%);
          text-anchor: middle;
        }
        .task-card {
          rx: 8px;
          ry: 8px;
          filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.1));
        }
      ]]>
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#boardGradient)" />

  <text x="50%" y="15%" class="board-title-main">Project Board</text>
  <text x="50%" y="23%" class="board-title-sub">Kanban-Style Organization</text>

  <!-- Columns -->
  <g id="column-todo" transform="translate(50, 150)">
    <rect width="220" height="200" fill="hsl(0, 0%, 98%)" rx="10" ry="10" stroke="hsl(0, 0%, 85%)" stroke-width="1"/>
    <text x="110" y="30" class="column-title">To Do</text>
    <rect class="task-card" x="20" y="50" width="180" height="40" fill="hsl(30, 80%, 85%)"/>
    <rect class="task-card" x="20" y="100" width="180" height="40" fill="hsl(30, 80%, 85%)"/>
  </g>

  <g id="column-inprogress" transform="translate(290, 150)">
    <rect width="220" height="200" fill="hsl(0, 0%, 98%)" rx="10" ry="10" stroke="hsl(0, 0%, 85%)" stroke-width="1"/>
    <text x="110" y="30" class="column-title">In Progress</text>
    <rect class="task-card" x="20" y="50" width="180" height="40" fill="hsl(200, 80%, 85%)"/>
    <rect class="task-card" x="20" y="100" width="180" height="40" fill="hsl(200, 80%, 85%)"/>
     <rect class="task-card" x="20" y="150" width="180" height="40" fill="hsl(200, 80%, 85%)"/>
  </g>

  <g id="column-done" transform="translate(530, 150)">
    <rect width="220" height="200" fill="hsl(0, 0%, 98%)" rx="10" ry="10" stroke="hsl(0, 0%, 85%)" stroke-width="1"/>
    <text x="110" y="30" class="column-title">Done</text>
    <rect class="task-card" x="20" y="50" width="180" height="40" fill="hsl(120, 60%, 85%)"/>
  </g>

</svg>