<svg width="800" height="400" viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .kpi-line { stroke: #A5B4FC; stroke-width: 1.5; stroke-linecap: round; } /* Indigo 300 */
      .axis-line { stroke: #9CA3AF; stroke-width: 1; } /* Gray 400 */
    </style>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1.5" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#F3F4F6" /> <!-- Gray 100 -->

  <!-- Dashboard Panel -->
  <g transform="translate(15, 15)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="120" rx="8" ry="8" fill="#FFFFFF"/> <!-- White -->
  </g>

  <g transform="translate(15, 15)"> <!-- Content within dashboard panel -->
    <!-- Optional: Dashboard Title/Header Element -->
    <rect x="10" y="8" width="50" height="8" rx="2" fill="#E5E7EB" /> <!-- Gray 200 -->

    <!-- Charts Area -->
    <g transform="translate(15, 25)">

      <!-- Bar Chart -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="70" height="50" fill="none"/>
        <!-- Axes -->
        <line x1="5" y1="45" x2="65" y2="45" class="axis-line"/>
        <line x1="5" y1="5" x2="5" y2="45" class="axis-line"/>
        <!-- Bars -->
        <rect x="10" y="20" width="12" height="25" fill="#3B82F6" rx="1"/> <!-- Blue 500 -->
        <rect x="27" y="10" width="12" height="35" fill="#10B981" rx="1"/> <!-- Emerald 500 -->
        <rect x="44" y="28" width="12" height="17" fill="#F59E0B" rx="1"/> <!-- Amber 500 -->
      </g>

      <!-- Line Chart -->
      <g transform="translate(80, 0)">
        <rect x="0" y="0" width="70" height="50" fill="none"/>
        <!-- Axes -->
        <line x1="5" y1="45" x2="65" y2="45" class="axis-line"/>
        <line x1="5" y1="5" x2="5" y2="45" class="axis-line"/>
        <!-- Line -->
        <polyline points="10,35 25,15 40,25 55,10" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <!-- Indigo 500 -->
        <!-- Points -->
        <circle cx="10" cy="35" r="2" fill="#4F46E5"/> <!-- Indigo 600 -->
        <circle cx="25" cy="15" r="2" fill="#4F46E5"/>
        <circle cx="40" cy="25" r="2" fill="#4F46E5"/>
        <circle cx="55" cy="10" r="2" fill="#4F46E5"/>
      </g>

      <!-- Pie Chart -->
      <g transform="translate(180, 25)"> <!-- Centered in its allocated space (cx=180+25=205, cy=0+25=25) -->
        <title>Pie Chart</title>
        <!-- Slices (radius 22) -->
        <!-- Slice 1 (0 to 120 deg) -->
        <path d="M 0 0 L 22 0 A 22 22 0 0 1 -11 19.05 Z" fill="#EF4444"/> <!-- Red 500 -->
        <!-- Slice 2 (120 to 240 deg) -->
        <path d="M 0 0 L -11 19.05 A 22 22 0 0 1 -11 -19.05 Z" fill="#8B5CF6"/> <!-- Violet 500 -->
        <!-- Slice 3 (240 to 360 deg) -->
        <path d="M 0 0 L -11 -19.05 A 22 22 0 0 1 22 0 Z" fill="#D946EF"/> <!-- Fuchsia 500 -->
      </g>
    </g>

    <!-- KPI Boxes Area -->
    <g transform="translate(15, 85)"> <!-- Below charts -->
      <!-- KPI Box 1 -->
      <g>
        <rect x="0" y="0" width="75" height="22" rx="3" fill="#E0E7FF"/> <!-- Indigo 100 -->
        <line x1="7" y1="7" x2="68" y2="7" class="kpi-line"/>
        <line x1="7" y1="15" x2="50" y2="15" class="kpi-line"/>
      </g>
      <!-- KPI Box 2 -->
      <g transform="translate(85, 0)">
        <rect x="0" y="0" width="75" height="22" rx="3" fill="#E0E7FF"/>
        <line x1="7" y1="7" x2="68" y2="7" class="kpi-line"/>
        <line x1="7" y1="15" x2="55" y2="15" class="kpi-line"/>
      </g>
      <!-- KPI Box 3 -->
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="75" height="22" rx="3" fill="#E0E7FF"/>
        <line x1="7" y1="7" x2="68" y2="7" class="kpi-line"/>
        <line x1="7" y1="15" x2="45" y2="15" class="kpi-line"/>
      </g>
    </g>
  </g>

</svg>