<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blogImgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(270, 80%, 65%)" /> <!-- Adjusted for a bit more vibrancy -->
      <stop offset="100%" stop-color="hsl(270, 60%, 50%)" />
    </linearGradient>
    <style>
      <![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap');
        
          font-family: 'Open Sans', sans-serif;
          font-weight: 700;
          font-size: 72px;
          fill: white;
          text-anchor: middle;
          letter-spacing: 1px;
        }
        
          font-family: 'Open Sans', sans-serif;
          font-weight: 400;
          font-size: 36px;
          fill: white;
          opacity: 0.9;
          text-anchor: middle;
          letter-spacing: 0.5px;
        }
        .graduation-cap-icon {
          /* Styles for the cap icon if needed, currently using direct attributes */
        }
      ]]>
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#blogImgGradient)" />

  <!-- Graduation Cap Icon -->
  <g class="graduation-cap-icon">
    <!-- Mortarboard (top square part) -->
    <path d="M370 95 L400 80 L430 95 L400 110 Z" fill="white"/>
    <!-- Button on top of mortarboard -->
    <circle cx="400" cy="95" r="3" fill="white"/>
    <!-- Tassel Cord -->
    <path d="M400 95 C403 95 415 105 420 118" stroke="white" stroke-width="2" fill="none"/>
    <!-- Tassel End -->
    <rect x="418" y="118" width="4" height="8" rx="1" fill="white"/>
  </g>

  <!-- Text Elements -->
  
  
</svg>
