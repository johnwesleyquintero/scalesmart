<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fallbackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(210, 20%, 55%)" />
      <stop offset="100%" stop-color="hsl(210, 20%, 40%)" />
    </linearGradient>
    <style>
      <![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap');
        .fallback-title {
          font-family: 'Open Sans', sans-serif;
          font-weight: 700;
          font-size: 64px; /* Slightly smaller for a more generic feel */
          fill: white;
          text-anchor: middle;
          letter-spacing: 0.5px;
        }
        .fallback-subtitle {
          font-family: 'Open Sans', sans-serif;
          font-weight: 400;
          font-size: 32px;
          fill: white;
          opacity: 0.85;
          text-anchor: middle;
        }
      ]]>
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#fallbackGradient)" />

  <text x="50%" y="45%" dy=".1em" class="fallback-title">ScaleSmart</text>
  <text x="50%" y="60%" dy=".1em" class="fallback-subtitle">Blog Post</text>
</svg>