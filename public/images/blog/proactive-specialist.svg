<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle gradient -->
  <rect width="800" height="600" fill="url(#gradient)" rx="12"/>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Header -->
  <rect x="40" y="40" width="720" height="80" rx="8" fill="#1e293b"/>
  <text x="400" y="90" font-family="sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">The Proactive Specialist</text>
  <text x="400" y="120" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Key Traits That Drive Success</text>

  <!-- Main content with 4 key traits -->
  <g transform="translate(60, 150)">
    <!-- Anticipation -->
    <circle cx="100" cy="100" r="80" fill="#3b82f6" opacity="0.9"/>
    <path d="M100,40 L100,80 M100,120 L100,160 M60,100 L80,100 M120,100 L140,100" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <text x="100" y="220" font-family="sans-serif" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">Anticipation</text>
    <text x="100" y="250" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle" width="160">Seeks patterns and prepares for future needs</text>

    <!-- Initiative -->
    <circle cx="300" cy="100" r="80" fill="#10b981" opacity="0.9"/>
    <path d="M260,100 L340,100 M300,60 L300,140" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <text x="300" y="220" font-family="sans-serif" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">Initiative</text>
    <text x="300" y="250" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle" width="160">Takes action without being asked</text>

    <!-- Adaptability -->
    <circle cx="500" cy="100" r="80" fill="#f59e0b" opacity="0.9"/>
    <path d="M460,100 L540,100 M500,60 L500,140" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M500,80 L520,120 L480,120 Z" fill="white"/>
    <text x="500" y="220" font-family="sans-serif" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">Adaptability</text>
    <text x="500" y="250" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle" width="160">Adjusts approach based on context</text>

    <!-- Ownership -->
    <circle cx="700" cy="100" r="80" fill="#ef4444" opacity="0.9"/>
    <path d="M660,100 L740,100 M700,60 L700,140" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M680,80 L720,80 L700,140 Z" fill="white"/>
    <text x="700" y="220" font-family="sans-serif" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">Ownership</text>
    <text x="700" y="250" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle" width="160">Takes responsibility for outcomes</text>
  </g>

  <!-- Bottom section with call to action -->
  <rect x="40" y="380" width="720" height="160" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="420" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">Becoming a Proactive Specialist</text>
  <text x="400" y="460" font-family="sans-serif" font-size="16" fill="#475569" text-anchor="middle">Develop these traits to create exceptional value in your organization</text>
  <rect x="300" y="490" width="200" height="40" rx="20" fill="#1e293b"/>
  <text x="400" y="515" font-family="sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Read Full Article</text>

  <!-- Footer with logo -->
  <text x="700" y="580" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="end">John Wesley Quintero</text>
</svg>