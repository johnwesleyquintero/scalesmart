<svg width="800" height="400" viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text-line { stroke: #CBD5E1; stroke-width: 2; stroke-linecap: round; } /* Slate 300 */
    </style>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#E0E7FF" /> <!-- Indigo 100 -->

  <!-- Resume Document -->
  <g transform="translate(40, 25)">
    <rect x="0" y="0" width="90" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/> <!-- Slate 400 border -->
    <!-- Text Lines -->
    <line x1="15" y1="20" x2="75" y2="20" class="text-line" />
    <line x1="15" y1="30" x2="75" y2="30" class="text-line" />
    <line x1="15" y1="40" x2="65" y2="40" class="text-line" />
    <line x1="15" y1="50" x2="75" y2="50" class="text-line" />
    <line x1="15" y1="60" x2="55" y2="60" class="text-line" />
    <line x1="15" y1="70" x2="75" y2="70" class="text-line" />
    <line x1="15" y1="80" x2="65" y2="80" class="text-line" />
  </g>

  <!-- Magnifying Glass (Scanner) -->
  <g transform="translate(115, 75)"> <!-- Position of the center of the lens -->
    <!-- Handle -->
    <rect x="20" y="-5" width="35" height="10" rx="3" ry="3" fill="#A0AEC0" transform="rotate(45, 20, 0)" /> <!-- Cool Gray 400 (Slate 500 equiv) -->
    <!-- Rim -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#718096" stroke-width="4"/> <!-- Cool Gray 500 (Slate 600 equiv) -->
    <!-- Lens -->
    <circle cx="0" cy="0" r="20" fill="rgba(96, 165, 250, 0.3)"/> <!-- Blue 400 with opacity -->
  </g>

  <!-- ATS Optimizer Elements -->
  <g transform="translate(180, 50)"> <!-- Group for optimizer elements, positioned to the right -->
    <!-- Nodes representing processing/data points -->
    <circle cx="0" cy="10" r="7" fill="#6366F1"/>   <!-- Node A (Indigo 500) -->
    <circle cx="40" cy="0" r="9" fill="#10B981"/>  <!-- Node B (Emerald 500) -->
    <circle cx="45" cy="40" r="6" fill="#F59E0B"/>  <!-- Node C (Amber 500) -->
    <circle cx="80" cy="25" r="8" fill="#6366F1"/>   <!-- Node D (Indigo 500), represents optimized output -->

    <!-- Connections between nodes -->
    <line x1="0" y1="10" x2="40" y2="0" stroke="#9CA3AF" stroke-width="1.5"/>   <!-- A to B (Cool Gray 400) -->
    <line x1="40" y1="0" x2="80" y2="25" stroke="#9CA3AF" stroke-width="1.5"/>   <!-- B to D -->
    <line x1="0" y1="10" x2="45" y2="40" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3,3"/> <!-- A to C (dashed) -->
    <line x1="45" y1="40" x2="80" y2="25" stroke="#9CA3AF" stroke-width="1.5"/> <!-- C to D -->

    <!-- Upward Arrow for Optimization Success -->
    <!-- Arrow: 10 wide, 15 tall. Tip at (0,0). Base at (0,15) -->
    <g transform="translate(80, -15)"> <!-- Position near Node D, pointing upwards from its vicinity -->
      <path d="M-5 15 L0 0 L5 15 M0 0 L0 15" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Emerald 500 -->
    </g>
  </g>

</svg>